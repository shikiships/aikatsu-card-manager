<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8a9c4">
<title>アイカツ！カード管理</title>
<style>
:root{--pink:#f28db2;--bg:#fff7fb;--card:#fff;--text:#3d3340;--muted:#8b7d88;--line:#eadde5;--accent:#f28db2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit}button{border:0}
header{position:sticky;top:0;z-index:5;background:rgba(255,247,251,.94);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 10px}.sub{font-size:12px;color:var(--muted)}
.wrap{max-width:760px;margin:auto;padding:14px 14px 100px}
.progress{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.progressTop{display:flex;justify-content:space-between;align-items:end}.big{font-size:27px;font-weight:800}.bar{height:8px;background:#f1e7ed;border-radius:99px;overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#fff7fa;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.controls{display:grid;gap:9px;margin-bottom:12px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
.row{display:flex;gap:8px;align-items:center}.toggle{padding:9px 12px;border-radius:999px;background:#eee5eb;color:var(--text);font-size:13px}.toggle.on{background:#f8c5d8}
.actions{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.countLabel{font-size:13px;color:var(--muted)}.primary{background:var(--accent);color:white;padding:11px 15px;border-radius:13px;font-weight:700}.floatingAdd{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;padding:13px 17px;border-radius:999px;box-shadow:0 5px 18px rgba(80,50,70,.22);white-space:nowrap}
.card{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;margin-bottom:9px;box-shadow:0 2px 8px rgba(80,50,70,.04)}
.thumb{width:72px;height:94px;border-radius:10px;background:linear-gradient(135deg,#f8e5ef,#fff);display:flex;align-items:center;justify-content:center;color:#b99aaa;font-size:11px;text-align:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.card > div:nth-child(2){min-width:0}.name{font-weight:750;font-size:15px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qbtn{width:29px;height:29px;border-radius:50%;background:#f5e9ef;font-size:19px;line-height:29px}.qnum{min-width:24px;text-align:center;font-weight:700}
.more{padding:6px 9px;background:transparent;color:var(--muted);font-size:18px}.favoriteStar{position:absolute;top:5px;right:5px;font-size:22px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}.offerCount{position:absolute;right:5px;bottom:5px;font-size:22px;line-height:1;color:#000;text-shadow:0 1px 3px rgba(255,255,255,.8);z-index:2}.thumb{position:relative}
.empty{text-align:center;color:var(--muted);padding:40px 15px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:6}
nav button{flex:1;max-width:180px;padding:10px;border-radius:12px;background:#f5edf2;color:#6f5d69}nav button.active{background:#f8c5d8;color:#5a3c49;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(40,25,35,.4);z-index:10;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 15px;font-size:19px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.memo{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.modalBtns{display:flex;gap:8px;margin-top:16px}.modalBtns button{flex:1;padding:12px;border-radius:12px}.cancel{background:#eee7eb}.save{background:var(--accent);color:#fff;font-weight:700}.danger{background:#fff0f2;color:#c45c76}
.sectionTitle{font-size:15px;font-weight:750;margin:20px 0 8px}.miniRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.miniBar{width:120px;height:7px;background:#eee5ea;border-radius:99px;overflow:hidden;display:inline-block;margin-left:8px}.miniBar i{display:block;height:100%;background:var(--accent)}
.tradeTabs{display:flex;gap:8px;background:#f5edf2;border-radius:14px;padding:4px;margin-bottom:12px}.tradeTabs button{flex:1;padding:10px;border-radius:10px;background:transparent;color:#6f5d69}.tradeTabs button.active{background:#fff;color:#5a3c49;font-weight:700;box-shadow:0 1px 5px rgba(80,50,70,.08)}
/* 表示形式切り替え */
.filterActionRow{width:100%}.viewToggle{margin-left:auto;width:42px;height:38px;padding:0;border-radius:12px;background:#eee5eb;color:var(--text);font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center}.viewToggle:active{transform:scale(.96)}.gridIcon{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:2px}.gridIcon i{display:block;width:8px;height:8px;box-sizing:border-box;border:1.5px solid currentColor;border-radius:1px}
#cardList.grid,#tradeCardList.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#cardList.grid .card,#tradeCardList.grid .card{display:block;padding:0;margin:0;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(80,50,70,.05)}
#cardList.grid .card .thumb,#tradeCardList.grid .card .thumb{width:100%;height:auto;aspect-ratio:72/94;border-radius:0}
#cardList.grid .card > div:nth-child(2),#cardList.grid .card > .more,#tradeCardList.grid .card > div:nth-child(2),#tradeCardList.grid .card > .more{display:none}
#cardList.grid .favoriteStar,#tradeCardList.grid .favoriteStar,#tradeCardList.grid .offerCount{font-size:20px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>🎀 アイカツ！カード管理</h1><div class="sub">あなたのカードコレクションを管理しよう</div></header>
<main class="wrap">
<section id="cardsView">
<div class="progress">
  <div class="progressTop"><div><div class="sub">コレクション進捗</div><div class="big" id="progressPct">0%</div></div><div class="sub" id="progressText">0 / 0 枚</div></div>
  <div class="bar"><i id="progressBar" style="width:0%"></i></div>
  <div class="stats"><div class="stat"><b id="uniqueCount">0</b><span>登録カード</span></div><div class="stat"><b id="ownedCount">0</b><span>所持カード</span></div><div class="stat"><b id="unownedCount">0</b><span>未所持</span></div></div>
</div>
<div class="controls">
  <input class="search" id="search" placeholder="🔎 カード名で検索">
  <div class="filters"><select id="typeFilter"><option value="">すべてのタイプ</option></select><select id="seriesFilter"><option value="">すべての弾</option></select></div>
  <select id="rarityFilter"><option value="">すべてのレアリティ</option><option value="PR">PR</option><option value="R">R</option><option value="N">N</option><option value="ER">ER</option></select>
  <div class="row filterActionRow"><button class="toggle" id="unownedToggle">未所持だけ表示</button><button class="toggle" id="clearFilters">絞り込み解除</button><button class="viewToggle" id="cardViewToggle" aria-label="グリッド形式に切り替え" title="グリッド形式"><span class="gridIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></div>
</div>
<div class="actions"><span class="countLabel" id="resultCount">0件</span></div>
<button class="primary floatingAdd" id="addBtn">＋ カードを追加</button>
<div id="cardList"></div>
</section>

<section id="tradeView" class="hidden">
<div class="tradeTabs"><button id="tradeWantTab" class="active">求</button><button id="tradeOfferTab">譲</button></div>
<div class="controls">
  <input class="search" id="tradeSearch" placeholder="🔎 カード名で検索">
  <div class="filters"><select id="tradeTypeFilter"><option value="">すべてのタイプ</option></select><select id="tradeSeriesFilter"><option value="">すべての弾</option></select></div>
  <select id="tradeRarityFilter"><option value="">すべてのレアリティ</option><option value="PR">PR</option><option value="R">R</option><option value="N">N</option><option value="ER">ER</option></select>
  <select id="tradeFavoriteFilter"><option value="">欲しい！：全部</option><option value="yes">欲しい！：あり</option><option value="no">欲しい！：なし</option></select>
  <div class="row filterActionRow"><button class="toggle" id="tradeClearFilters">絞り込み解除</button><button class="viewToggle" id="tradeViewToggle" aria-label="グリッド形式に切り替え" title="グリッド形式"><span class="gridIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></div>
</div>
<div class="actions"><span class="countLabel" id="tradeResultCount">0件</span></div>
<div id="tradeCardList"></div>
</section>

<section id="statsView" class="hidden">
<div class="progress"><div class="progressTop"><div><div class="sub">コレクション全体</div><div class="big" id="statsPct">0%</div></div><div class="sub" id="statsOwned">0 / 0</div></div><div class="bar"><i id="statsBar" style="width:0%"></i></div></div>
<div class="sectionTitle">タイプ別</div><div id="typeStats"></div>
<div class="sectionTitle">弾別</div><div id="seriesStats"></div>
<div class="sectionTitle">レアリティ別</div><div id="rarityStats"></div>
<div class="sectionTitle">データ</div>
<div class="row"><button class="toggle" id="exportBtn">データを書き出す</button><button class="toggle" id="importBtn">データを読み込む</button><input id="importFile" type="file" accept=".json" class="hidden"></div>
</section>
</main>

<nav><button id="tabCards" class="active">カード一覧</button><button id="tabTrade">トレード</button><button id="tabStats">進捗・統計</button></nav>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">カードを追加</h2>
<div class="field"><label>カード名</label><input id="nameInput" placeholder="例：○○コーデ"></div>
<div class="field"><label>タイプ</label><select id="typeInput"><option value="">タイプを選択</option><option value="キュート">キュート</option><option value="クール">クール</option><option value="セクシー">セクシー</option><option value="ポップ">ポップ</option></select></div>
<div class="field"><label>第○弾</label><input id="seriesInput" placeholder="例：第1弾"></div>
<div class="field"><label>レアリティ</label><select id="rarityInput"><option value="">未設定</option><option value="PR">PR</option><option value="R">R</option><option value="N">N</option><option value="ER">ER</option></select></div>
<div class="field"><label>所持枚数</label><input id="qtyInput" type="number" min="0" step="1" value="0"></div><div class="field"><label>お気に入り</label><button type="button" class="toggle" id="favoriteInput">☆ 欲しい！</button></div>
<div class="field"><label>メモ（30文字まで）</label><input id="memoInput" maxlength="30" placeholder="例：交換予定"></div>
<div class="field"><label>カード画像（任意）</label><input id="imageInput" type="file" accept="image/*"></div>
<div class="modalBtns"><button class="cancel" id="cancelBtn">キャンセル</button><button class="save" id="saveBtn">保存</button></div>
<button class="modalBtns danger hidden" id="deleteBtn">このカードを削除</button>
</div></div>

<script>
const KEY="aikatsu-card-manager-v1";
let cards=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null, unownedOnly=false, tradeMode="want", cardViewMode="list", tradeViewMode="list";

const $=id=>document.getElementById(id);
function saveData(){localStorage.setItem(KEY,JSON.stringify(cards))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uniq(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"))}
function updateFilters(){
  const types=uniq(cards.map(c=>c.type)), series=uniq(cards.map(c=>c.series));
  const t=$("typeFilter").value, s=$("seriesFilter").value;
  $("typeFilter").innerHTML='<option value="">すべてのタイプ</option>'+types.map(x=>`<option>${esc(x)}</option>`).join("");
  $("seriesFilter").innerHTML='<option value="">すべての弾</option>'+series.map(x=>`<option>${esc(x)}</option>`).join("");
  $("typeFilter").value=t; $("seriesFilter").value=s;
}
function progress(){
  const total=cards.length, owned=cards.filter(c=>Number(c.qty)>0).length;
  const pct=total?Math.round(owned/total*100):0;
  $("progressPct").textContent=pct+"%"; $("progressText").textContent=`${owned} / ${total} 枚`;
  $("progressBar").style.width=pct+"%"; $("uniqueCount").textContent=total;
  $("ownedCount").textContent=owned; $("unownedCount").textContent=total-owned;
}
function render(){
 updateFilters(); progress();
 const q=$("search").value.trim().toLowerCase(), type=$("typeFilter").value, series=$("seriesFilter").value, rarity=$("rarityFilter").value;
 const list=cards.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!type||c.type===type)&&(!series||c.series===series)&&(!rarity||c.rarity===rarity)&&(!unownedOnly||Number(c.qty)===0));
 $("resultCount").textContent=list.length+"件";
 $("cardList").classList.toggle("grid",cardViewMode==="grid");
 $("cardViewToggle").innerHTML=cardViewMode==="list"?'<span class="gridIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>':"☰";
 $("cardViewToggle").setAttribute("aria-label",cardViewMode==="list"?"グリッド形式に切り替え":"リスト形式に切り替え");
 $("cardViewToggle").title=cardViewMode==="list"?"グリッド形式":"リスト形式";
 $("cardList").innerHTML=list.length?list.map(c=>`
 <article class="card">
  <div class="thumb">${c.image?`<img src="${c.image}">`:"カード画像"}${c.favorite?`<span class="favoriteStar">☆</span>`:""}</div>
  <div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.type||"タイプ未設定")} ・ ${esc(c.series||"弾未設定")} ・ ${esc(c.rarity||"レアリティ未設定")}</div>${c.memo?`<div class="memo">📝 ${esc(c.memo)}</div>`:""}
   <div class="qty"><button class="qbtn" onclick="changeQty('${c.id}',-1)">−</button><span class="qnum">${Number(c.qty)||0}</span><button class="qbtn" onclick="changeQty('${c.id}',1)">＋</button></div>
  </div>
  <button class="more" onclick="openEdit('${c.id}')">⋯</button>
 </article>`).join(""):`<div class="empty">${cards.length?"条件に合うカードがありません。":"「カードを追加」から登録してね。"} </div>`;
}
function updateTradeFilters(){
  const types=uniq(cards.map(c=>c.type)), series=uniq(cards.map(c=>c.series));
  const t=$("tradeTypeFilter").value, s=$("tradeSeriesFilter").value;
  $("tradeTypeFilter").innerHTML='<option value="">すべてのタイプ</option>'+types.map(x=>`<option>${esc(x)}</option>`).join("");
  $("tradeSeriesFilter").innerHTML='<option value="">すべての弾</option>'+series.map(x=>`<option>${esc(x)}</option>`).join("");
  $("tradeTypeFilter").value=t; $("tradeSeriesFilter").value=s;
}
function renderTrade(){
  updateTradeFilters();
  const q=$("tradeSearch").value.trim().toLowerCase();
  const type=$("tradeTypeFilter").value, series=$("tradeSeriesFilter").value, rarity=$("tradeRarityFilter").value, fav=$("tradeFavoriteFilter").value;
  let list=cards.filter(c=>(tradeMode==="want"?Number(c.qty)===0:Number(c.qty)>=2) && (!q||c.name.toLowerCase().includes(q)) && (!type||c.type===type) && (!series||c.series===series) && (!rarity||c.rarity===rarity) && (!fav||(fav==="yes"?!!c.favorite:!c.favorite)));
  $("tradeResultCount").textContent=list.length+"件";
  $("tradeCardList").classList.toggle("grid",tradeViewMode==="grid");
  $("tradeViewToggle").innerHTML=tradeViewMode==="list"?'<span class="gridIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>':"☰";
  $("tradeViewToggle").setAttribute("aria-label",tradeViewMode==="list"?"グリッド形式に切り替え":"リスト形式に切り替え");
  $("tradeViewToggle").title=tradeViewMode==="list"?"グリッド形式":"リスト形式";
  $("tradeCardList").innerHTML=list.length?list.map(c=>`
 <article class="card">
  <div class="thumb">${c.image?`<img src="${c.image}">`:"カード画像"}${c.favorite?`<span class="favoriteStar">☆</span>`:""}${tradeMode==="offer"?`<span class="offerCount">${Math.max(0,Number(c.qty)||0)-1}</span>`:""}</div>
  <div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.type||"タイプ未設定")} ・ ${esc(c.series||"弾未設定")} ・ ${esc(c.rarity||"レアリティ未設定")}</div>${c.memo?`<div class="memo">📝 ${esc(c.memo)}</div>`:""}</div>
  <button class="more" onclick="openEdit('${c.id}')">⋯</button>
 </article>`).join(""):`<div class="empty">条件に合うカードがありません。</div>`;
}
function changeQty(id,d){const c=cards.find(x=>x.id===id); if(!c)return;c.qty=Math.max(0,(Number(c.qty)||0)+d);saveData();render();renderTrade();renderStats()}
function openAdd(){editingId=null;$("modalTitle").textContent="カードを追加";$("nameInput").value="";$("typeInput").value="";$("seriesInput").value="";$("rarityInput").value="";$("qtyInput").value=0;$("memoInput").value="";$("favoriteInput").classList.remove("on");$("favoriteInput").textContent="☆ 欲しい！";$("imageInput").value="";$("deleteBtn").classList.add("hidden");$("modal").classList.add("show")}
function openEdit(id){const c=cards.find(x=>x.id===id);if(!c)return;editingId=id;$("modalTitle").textContent="カードを編集";$("nameInput").value=c.name;$("typeInput").value=c.type;$("seriesInput").value=c.series;$("rarityInput").value=c.rarity||"";$("qtyInput").value=c.qty;$("memoInput").value=c.memo||"";$("favoriteInput").classList.toggle("on",!!c.favorite);$("favoriteInput").textContent=c.favorite?"★ 欲しい！":"☆ 欲しい！";$("imageInput").value="";$("deleteBtn").classList.remove("hidden");$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
async function saveCard(){
 const name=$("nameInput").value.trim(); if(!name){alert("カード名を入力してね");return}
 let image=editingId?(cards.find(c=>c.id===editingId)?.image||""):"";
 const file=$("imageInput").files[0];
 if(file) image=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
 const data={name,type:$("typeInput").value.trim(),series:$("seriesInput").value.trim(),rarity:$("rarityInput").value,qty:Math.max(0,Number($("qtyInput").value)||0),memo:$("memoInput").value.trim(),favorite:$("favoriteInput").classList.contains("on"),image};
 if(editingId){Object.assign(cards.find(c=>c.id===editingId),data)}else{cards.push({id:crypto.randomUUID(),...data})}
 saveData();closeModal();render();renderTrade();renderStats()
}
function renderStats(){
 const total=cards.length, owned=cards.filter(c=>Number(c.qty)>0).length, pct=total?Math.round(owned/total*100):0;
 $("statsPct").textContent=pct+"%";$("statsOwned").textContent=`${owned} / ${total}`;$("statsBar").style.width=pct+"%";
 const group=(key)=>{const m={};cards.forEach(c=>{const k=c[key]||"未設定";m[k]??={t:0,o:0};m[k].t++;if(Number(c.qty)>0)m[k].o++});return m};
 const draw=m=>Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],"ja")).map(([k,v])=>`<div class="miniRow"><span>${esc(k)}</span><span>${v.o}/${v.t}<span class="miniBar"><i style="width:${v.t?Math.round(v.o/v.t*100):0}%"></i></span></span></div>`).join("")||'<div class="sub">まだカードがありません。</div>';
 $("typeStats").innerHTML=draw(group("type"));$("seriesStats").innerHTML=draw(group("series"));$("rarityStats").innerHTML=draw(group("rarity"));
}
$("addBtn").onclick=openAdd;$("cancelBtn").onclick=closeModal;$("saveBtn").onclick=saveCard;$("favoriteInput").onclick=()=>{$("favoriteInput").classList.toggle("on");$("favoriteInput").textContent=$("favoriteInput").classList.contains("on")?"★ 欲しい！":"☆ 欲しい！"};
$("deleteBtn").onclick=()=>{if(confirm("このカードを削除する？")){cards=cards.filter(c=>c.id!==editingId);saveData();closeModal();render();renderTrade();renderStats()}};
["search","typeFilter","seriesFilter","rarityFilter"].forEach(id=>$(id).addEventListener("input",render));
["tradeSearch","tradeTypeFilter","tradeSeriesFilter","tradeRarityFilter","tradeFavoriteFilter"].forEach(id=>$(id).addEventListener("input",renderTrade));
$("tradeClearFilters").onclick=()=>{$("tradeSearch").value="";$('tradeTypeFilter').value="";$('tradeSeriesFilter').value="";$('tradeRarityFilter').value="";$('tradeFavoriteFilter').value="";renderTrade()};
$("tradeWantTab").onclick=()=>{tradeMode="want";$('tradeWantTab').classList.add('active');$('tradeOfferTab').classList.remove('active');renderTrade()};
$("tradeOfferTab").onclick=()=>{tradeMode="offer";$('tradeOfferTab').classList.add('active');$('tradeWantTab').classList.remove('active');renderTrade()};
$("cardViewToggle").onclick=()=>{cardViewMode=cardViewMode==="list"?"grid":"list";render()};
$("tradeViewToggle").onclick=()=>{tradeViewMode=tradeViewMode==="list"?"grid":"list";renderTrade()};
$("unownedToggle").onclick=()=>{unownedOnly=!unownedOnly;$("unownedToggle").classList.toggle("on",unownedOnly);render()};
$("clearFilters").onclick=()=>{$("search").value="";$("typeFilter").value="";$("seriesFilter").value="";$("rarityFilter").value="";unownedOnly=false;$("unownedToggle").classList.remove("on");render()};
function setMainTab(tab){
  $("cardsView").classList.toggle("hidden",tab!=="cards");
  $("tradeView").classList.toggle("hidden",tab!=="trade");
  $("statsView").classList.toggle("hidden",tab!=="stats");
  $("tabCards").classList.toggle("active",tab==="cards");
  $("tabTrade").classList.toggle("active",tab==="trade");
  $("tabStats").classList.toggle("active",tab==="stats");
  $("addBtn").classList.toggle("hidden",tab!=="cards");
  if(tab==="trade")renderTrade();
  if(tab==="stats")renderStats();
}
$("tabCards").onclick=()=>setMainTab("cards");
$("tabTrade").onclick=()=>setMainTab("trade");
$("tabStats").onclick=()=>setMainTab("stats");
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aikatsu-cards.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;cards=x;saveData();render();renderTrade();renderStats();alert("読み込みました！")}catch{alert("JSONデータを読み込めませんでした")}};r.readAsText(f)};
render();renderTrade();renderStats();
</script>
</body>
</html>
